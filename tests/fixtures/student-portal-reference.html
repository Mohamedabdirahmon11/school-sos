<!doctype html>
<html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Student Portal reference</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#17203a;--mut:#62708f;--line:#dde2ee;--nav:#1d2b53;--navink:#e9edf8;--acc:#e8a23a;--accink:#2a1c00;--ok:#1b7f4b;--warn:#a65b00;--bad:#b3261e;--soft:#eaeffa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{--bg:#0e1424;--card:#171f36;--ink:#e8ecf8;--mut:#9aa7c7;--line:#2a3555;--nav:#0a0f1d;--navink:#d7ddf0;--acc:#f0b255;--ok:#4cc58a;--warn:#e8a042;--bad:#f2867f;--soft:#1e2846;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}h1,h2,h3{font-family:Georgia,serif;margin:0}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:var(--nav);color:var(--navink);padding:18px 12px;position:sticky;top:0;height:100vh}.me{display:flex;gap:10px;align-items:center;padding:6px 8px 16px}.av{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--accink);display:grid;place-items:center;font-weight:700;flex:none}.me small{opacity:.75;display:block;font-size:11px}#nav{display:flex;flex-direction:column;gap:2px}.nb{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;font:inherit;padding:10px;border-radius:8px;cursor:pointer;text-align:left;position:relative;width:100%}.nb.on{background:#ffffff29;font-weight:700}.bd{margin-left:auto;background:var(--acc);color:var(--accink);border-radius:10px;font-size:11px;padding:0 7px;font-weight:700}main{padding:22px clamp(14px,4vw,40px) 40px;max-width:980px;width:100%}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}.top p{margin:2px 0 0;color:var(--mut)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.big{font:700 30px Georgia,serif}.lbl{color:var(--mut);font-size:13px}.bar{height:8px;background:var(--soft);border-radius:4px;overflow:hidden;margin-top:6px}.bar i{display:block;height:100%;background:var(--ok)}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.pill{font-size:12px;padding:2px 9px;border-radius:10px;background:var(--soft)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.btn{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:700}.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}.cal b{color:var(--mut)}.d{padding:8px 0;border-radius:8px;background:var(--soft)}.d.P{background:color-mix(in srgb,var(--ok) 25%,transparent)}.d.A{background:color-mix(in srgb,var(--bad) 30%,transparent)}.d.L{background:color-mix(in srgb,var(--warn) 30%,transparent)}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}.empty{color:var(--mut);font-style:italic;padding:10px 0}#bnav{display:none}.sheet{display:none}
@media(max-width:760px){.app{display:block}aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;z-index:5;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}.me,#nav{display:none}#bnav{display:flex;position:relative}#bnav>.nb{flex:1;align-items:center;flex-direction:column;font-size:11px;gap:0;padding:6px 10px}main{padding-bottom:100px}.sheet{display:block;position:absolute;right:6px;bottom:calc(100% + 6px);background:var(--nav);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:200px;box-shadow:0 8px 24px #0005}.sheet .nb{flex-direction:row;font-size:15px;gap:10px;padding:11px 14px;width:100%}}
:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
</style></head><body><div class="app"><aside><div class="me"><div class="av">FA</div><div><b>Faadumo Axmed</b><small>Fasalka 8A · ID ST-0421</small></div></div><nav id="nav" aria-label="Qaybaha"></nav><nav id="bnav" aria-label="Menu hoose"></nav></aside><main id="main"></main></div>
<script>
const nav=[['home','🏠','Hoyga'],['tt','🗓️','Jadwal'],['att','✅','Imaanshaha'],['marks','📊','Natiijo'],['hw','📚','Hawlo'],['news','📢','Ogeysiis'],['msg','💬','Fariimo'],['me','👤','Profile']];
const pages={
home:'<div class="grid"><div class="card"><div class="lbl">Imaanshaha bishan</div><div class="big">92%</div><div class="bar"><i style="width:92%"></i></div></div><div class="card"><div class="lbl">Celceliska natiijada</div><div class="big">84%</div><span class="pill ok">Darajo A</span></div><div class="card"><div class="lbl">Hawlo harsan</div><div class="big">2</div><button class="btn sec">Fur hawlaha</button></div></div><div class="card"><h3>Jadwalka maanta</h3><div class="row"><b>08:00 · Xisaab</b><span class="lbl">Axmed Cali</span></div><div class="row"><b>08:45 · Soomaali</b><span class="lbl">Hodan Nuur</span></div></div><div class="card"><h3>Ogeysiisyada ugu dambeeyay</h3><div class="row"><b>Imtixaanka dhexe</b><span class="pill warn">cusub</span></div><div class="row"><b>Maalinta waalidiinta</b></div></div>',
tt:'<div class="card"><h3>Jadwalka fasalka</h3><p class="lbl">Fasalka 8A · Sabti – Khamiis</p><div style="overflow:auto"><table><tr><th>Waqti</th><th>Sabti</th><th>Axad</th><th>Isniin</th><th>Talaado</th><th>Arbaco</th><th>Khamiis</th></tr><tr><td>08:00</td><td>Xisaab</td><td>Ingiriisi</td><td>Sayniis</td><td>Soomaali</td><td>Carabi</td><td>Xisaab</td></tr><tr><td>08:45</td><td>Soomaali</td><td>Xisaab</td><td>Ingiriisi</td><td>Xisaab</td><td>Sayniis</td><td>Taariikh</td></tr><tr><td>09:30</td><td>Ingiriisi</td><td>Sayniis</td><td>Xisaab</td><td>Juqraafi</td><td>Xisaab</td><td>Soomaali</td></tr></table></div><p class="lbl">Jimcuhu waa fasax.</p></div>',
att:'<div class="grid"><div class="card"><div class="lbl">Joogay</div><div class="big ok">18</div></div><div class="card"><div class="lbl">Maqnaa</div><div class="big bad">1</div></div><div class="card"><div class="lbl">Daahay</div><div class="big warn">2</div></div></div><div class="card"><h3>Imaanshaha · Nofeembar 2026</h3><div class="cal"><b>Ax</b><b>Is</b><b>Ta</b><b>Ar</b><b>Kh</b><b>Jim</b><b>Sab</b>'+Array.from({length:30},(_,i)=>'<div class="d '+(i%9===2?'A':i%7===3?'L':'P')+'">'+(i+1)+'</div>').join('')+'</div><p class="lbl">Cagaar = joogay · Casaan = maqnaa · Huruud = daahay</p></div>',
marks:'<div class="card"><h3>Natiijooyinka</h3><p class="lbl">Waxaa muuqda kaliya natiijooyinka la daabacay (Published)</p><div style="overflow:auto"><table><tr><th>Maaddo</th><th>Quiz</th><th>Dhexe</th><th>Final</th><th>Wadarta</th><th>Darajo</th></tr><tr><td>Xisaab</td><td>18</td><td>27</td><td>52</td><td>88%</td><td><span class="pill ok">A</span></td></tr><tr><td>Soomaali</td><td>17</td><td>24</td><td>45</td><td>78%</td><td><span class="pill ok">B</span></td></tr><tr><td>Ingiriisi</td><td>15</td><td>22</td><td>41</td><td>71%</td><td><span class="pill ok">B</span></td></tr></table></div></div>',
hw:'<div class="tabs"><button class="btn">Harsan</button><button class="btn sec">La gudbiyey</button><button class="btn sec">Dhammaan</button></div><div class="card"><div class="row"><b>Xisaab</b><span class="pill warn">Berri</span></div><h3>Layliska 5.2 (1–12)</h3><p class="lbl">Dhammaad: 2026-11-23</p><button class="btn">Gudbi hawsha</button></div><div class="card"><div class="row"><b>Sayniis</b><span class="pill bad">dhaafay</span></div><h3>Sawir unugga dhirta</h3><p class="lbl">Dhammaad: 2026-11-20</p><button class="btn">Gudbi hawsha</button></div>',
news:'<div class="card"><div class="row"><h3>Imtixaanka dhexe: jadwalka cusub</h3><span class="lbl">21 Nov 2026</span></div><p>Imtixaanku wuxuu bilaabmayaa toddobaadka dambe. Soo qaad aalado qoraal oo buuxa.</p><span class="pill warn">cusub</span></div><div class="card"><div class="row"><h3>Maalinta Isbeddelka Waalidka</h3><span class="lbl">19 Nov 2026</span></div><p>Waalidku waxay la kulmayaan macallimiinta Khamiista, 10:00 – 13:00.</p></div>',
msg:'<div class="card"><h3>Fariimaha</h3><p class="lbl">Waxaad la hadli kartaa macallimiinta fasalkaaga oo keliya</p><div class="row"><b>Axmed Cali · Xisaab</b><span class="pill">Macallin</span></div><div class="card" style="margin-top:12px"><p>Fadlan layliska 5.2 si taxadar leh u samee.</p><p style="text-align:right"><span class="pill">Aniga</span> Waad mahadsan tahay macallin.</p><input placeholder="Qor fariin…"></div></div>',
me:'<div class="card">'+[['Magac','Faadumo Axmed Cabdi'],['ID','ST-0421'],['Fasal','8A'],['Form Teacher','Axmed Cali'],['Sanad dugsiyeed','2026/2027']].map(x=>'<div class="row"><span class="lbl">'+x[0]+'</span><b>'+x[1]+'</b></div>').join('')+'</div><div class="card"><h3>Muuqaalka</h3><button class="btn sec">Otomaatig</button> <button class="btn sec">Iftiin</button> <button class="btn sec">Mugdi</button></div>'
};
let more=false;function button(item,extra=''){return '<button class="nb '+extra+'" data-view="'+item[0]+'"><span>'+item[1]+'</span>'+item[2]+(item[0]==='hw'?'<i class="bd">2</i>':item[0]==='news'?'<i class="bd">1</i>':'')+'</button>'}
function render(){const view=location.hash.slice(1)||'home';const item=nav.find(x=>x[0]===view)||nav[0];document.getElementById('main').innerHTML='<div class="top"><div><h1>'+(view==='home'?'Soo dhawoow, Faadumo 👋':item[2])+'</h1><p>Fasalka 8A · 2026/2027</p></div></div>'+(pages[view]||pages.home);document.getElementById('nav').innerHTML=nav.map(x=>button(x,x[0]===view?'on':'')).join('');const extra=['tt','att','news','msg','me'].map(k=>nav.find(x=>x[0]===k));document.getElementById('bnav').innerHTML=['home','hw','marks'].map(k=>button(nav.find(x=>x[0]===k))).join('')+'<button class="nb" id="more"><span>☰</span>Dheeraad</button>'+(more?'<div class="sheet">'+extra.map(x=>button(x)).join('')+'</div>':'');document.querySelectorAll('[data-view]').forEach(b=>b.onclick=()=>{location.hash=b.dataset.view;more=false;render()});const m=document.getElementById('more');if(m)m.onclick=()=>{more=!more;render()}}
const theme=new URLSearchParams(location.search).get('theme')||'light';document.documentElement.setAttribute('data-theme',theme);window.addEventListener('hashchange',render);render();
</script></body></html>
