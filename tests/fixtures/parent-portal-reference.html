<!doctype html>
<html lang="so"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Parent Portal reference</title>
<style>
:root{--bg:#f3f5fa;--card:#fff;--ink:#17203a;--mut:#62708f;--line:#dde2ee;--nav:#1d2b53;--navink:#e9edf8;--acc:#e8a23a;--accink:#2a1c00;--ok:#1b7f4b;--warn:#a65b00;--bad:#b3261e;--soft:#eaeffa;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
:root[data-theme=dark]{--bg:#0e1424;--card:#171f36;--ink:#e8ecf8;--mut:#9aa7c7;--line:#2a3555;--nav:#0a0f1d;--navink:#d7ddf0;--acc:#f0b255;--ok:#4cc58a;--warn:#e8a042;--bad:#f2867f;--soft:#1e2846;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 "Trebuchet MS","Segoe UI",system-ui,sans-serif}h1,h2,h3{font-family:Georgia,serif;margin:0}.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}aside{background:var(--nav);color:var(--navink);padding:18px 12px;position:sticky;top:0;height:100vh}.me{display:flex;gap:10px;align-items:center;padding:6px 8px 16px}.av{width:42px;height:42px;border-radius:50%;background:var(--acc);color:var(--accink);display:grid;place-items:center;font-weight:700;flex:none}.me small{opacity:.75;display:block;font-size:11px}.sect{font-size:11px;letter-spacing:.08em;text-transform:uppercase;opacity:.65;padding:6px 10px 4px}#kl{display:flex;flex-direction:column;gap:2px;margin-bottom:10px}.kid{display:flex;gap:8px;align-items:center;padding:8px;border-radius:8px}.kid .av{width:30px;height:30px;font-size:11px}.kid small{display:block;font-size:11px;opacity:.7}#nav{display:flex;flex-direction:column;gap:2px}.nb{display:flex;align-items:center;gap:10px;background:none;border:0;color:inherit;font:inherit;padding:10px;border-radius:8px;cursor:pointer;text-align:left;position:relative;width:100%}.nb.on{background:#ffffff29;font-weight:700}.bd{margin-left:auto;background:var(--acc);color:var(--accink);border-radius:10px;font-size:11px;padding:0 7px;font-weight:700}main{padding:22px clamp(14px,4vw,40px) 40px;max-width:980px;width:100%}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:16px}.top p{margin:2px 0 0;color:var(--mut)}.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:14px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}.big{font:700 30px Georgia,serif}.lbl{color:var(--mut);font-size:13px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}.row:last-child{border:0}.pill{font-size:12px;padding:2px 9px;border-radius:10px;background:var(--soft)}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}.btn{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:8px 14px;font:inherit;font-weight:700}.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}.tabs{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;text-align:center;font-size:13px}.cal b{color:var(--mut);font-weight:600}.d{padding:8px 0;border-radius:8px;background:var(--soft)}.d.P{background:color-mix(in srgb,var(--ok) 25%,transparent)}.d.A{background:color-mix(in srgb,var(--bad) 30%,transparent)}.d.L{background:color-mix(in srgb,var(--warn) 30%,transparent)}.wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}td,th{padding:8px 6px;border-bottom:1px solid var(--line);text-align:left}.empty{color:var(--mut);font-style:italic;padding:10px 0}.strip{display:none}.sheet{display:none}:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
@media(max-width:760px){.app{display:block}aside{position:fixed;bottom:0;left:0;right:0;top:auto;height:auto;z-index:5;padding:4px 4px calc(4px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line)}.me,#kl,.sect,#nav{display:none}#bnav{display:flex;position:relative}#bnav>.nb{flex:1;align-items:center;flex-direction:column;font-size:11px;gap:0;padding:6px 10px}.strip{display:flex;gap:8px;overflow:auto;margin:0 0 14px}.strip button{white-space:nowrap}main{padding-bottom:100px}.sheet{display:block;position:absolute;right:6px;bottom:calc(100% + 6px);background:var(--nav);border:1px solid var(--line);border-radius:12px;padding:6px;min-width:200px;box-shadow:0 8px 24px #0005}.sheet .nb{flex-direction:row;font-size:15px;gap:10px;padding:11px 14px;width:100%}}
</style></head><body><div class="app"><aside><div class="me"><div class="av">AC</div><div><b>Axmed Cabdi</b><small>Waalid · 3 ilmood</small></div></div><div class="sect">Caruurtayda</div><div id="kl"><div class="kid"><div class="av">FA</div><div><b>Faadumo</b><small>Fasalka 8A</small></div><i class="bd">3</i></div><div class="kid"><div class="av">CA</div><div><b>Cabdi</b><small>Fasalka 5B</small></div></div><div class="kid"><div class="av">HA</div><div><b>Hodan</b><small>Fasalka 2A</small></div></div></div><nav id="nav"></nav><nav id="bnav"></nav></aside><main id="main"></main></div>

const theme=new URLSearchParams(location.search).get('theme')||'light';document.documentElement.setAttribute('data-theme',theme);window.addEventListener('hashchange',render);render();
