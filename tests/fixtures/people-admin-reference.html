<!DOCTYPE html>
<html lang="so">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>People – SchoolOS Admin</title>
<style>
:root{--bg:#f6f4ee;--card:#fff;--ink:#1c2b26;--mut:#5f6f68;--line:#d9d6cb;--side:#1f4d3f;--sideink:#e8f1ec;--ok:#1b7f4b;--warn:#a65b00;--bad:#b3261e;--acc:#1f4d3f;--accink:#fff;--soft:#eaf2ed;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121a17;--card:#1a2420;--ink:#e6efe9;--mut:#9db0a7;--line:#2d3b35;--side:#0d2a21;--sideink:#d5e6dd;--ok:#4cc58a;--warn:#e8a042;--bad:#f2867f;--acc:#4cc58a;--accink:#08241a;--soft:#1f2f28;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#121a17;--card:#1a2420;--ink:#e6efe9;--mut:#9db0a7;--line:#2d3b35;--side:#0d2a21;--sideink:#d5e6dd;--ok:#4cc58a;--warn:#e8a042;--bad:#f2867f;--acc:#4cc58a;--accink:#08241a;--soft:#1f2f28;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Source Sans 3","Segoe UI",system-ui,sans-serif}
h1,h2,h3{font-family:Georgia,serif;margin:0}
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
aside.sb{background:var(--side);color:var(--sideink);padding:18px 12px;position:sticky;top:0;height:100vh}
.sb h2{font-size:18px;padding:0 8px 2px}.sb small{display:block;padding:0 8px 14px;opacity:.7}
.tb{display:flex;align-items:center;gap:10px;width:100%;background:none;border:0;color:inherit;font:inherit;padding:10px;border-radius:8px;cursor:pointer;text-align:left}
.tb:hover{background:rgba(255,255,255,.08)}.tb.on{background:rgba(255,255,255,.16);font-weight:700}.tb .n{margin-left:auto;font-size:12px;opacity:.8}
main{padding:22px clamp(14px,3vw,36px) 50px;min-width:0}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.hd h1{font-size:26px}.hd p{margin:2px 0 0;color:var(--mut)}
.btn{background:var(--acc);color:var(--accink);border:0;border-radius:8px;padding:9px 16px;font:inherit;font-weight:700;cursor:pointer}
.btn.sec{background:transparent;color:var(--ink);border:1px solid var(--line)}.btn.sm{padding:4px 9px;font-size:13px}.btn.dng{background:var(--bad);color:#fff}
.btn:disabled{opacity:.5;cursor:not-allowed}
.bar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:12px}
input,select,textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);font:inherit}
.bar input{flex:1;min-width:180px}.bar select{width:auto;min-width:130px}
:focus-visible{outline:3px solid var(--acc);outline-offset:1px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px;margin-bottom:14px}
.wrap{overflow-x:auto;padding:0}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mut);font-weight:600;font-size:12px;text-transform:uppercase;letter-spacing:.04em}
tr:last-child td{border:0}
.pill{font-size:12px;padding:2px 9px;border-radius:10px;background:var(--soft);white-space:nowrap;display:inline-block;margin:1px 2px 1px 0}.pill.ok{color:var(--ok)}.pill.warn{color:var(--warn)}.pill.bad{color:var(--bad)}
.av{display:inline-grid;place-items:center;width:30px;height:30px;border-radius:50%;background:var(--acc);color:var(--accink);font-size:12px;font-weight:700;margin-right:8px;vertical-align:middle}
.empty{padding:34px;text-align:center;color:var(--mut)}
.pg{display:flex;justify-content:space-between;align-items:center;padding:10px 12px;color:var(--mut);font-size:13px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:flex;justify-content:flex-end}
.dr{background:var(--card);width:min(480px,100%);height:100%;overflow:auto;padding:20px;padding-bottom:calc(20px + env(safe-area-inset-bottom,0px))}
.dr h2{font-size:22px;margin-bottom:4px}.dr .sub{color:var(--mut);margin:0 0 16px}
.f{margin-bottom:14px}.f label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}.f .req{color:var(--bad)}
.f .er{color:var(--bad);font-size:13px;margin-top:3px}.f.bad input,.f.bad select{border-color:var(--bad)}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sec{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mut);margin:18px 0 8px;border-top:1px solid var(--line);padding-top:12px}
.chips{display:flex;flex-wrap:wrap;gap:6px}.chips label{display:flex;gap:6px;align-items:center;font-weight:400;border:1px solid var(--line);border-radius:20px;padding:4px 10px;margin:0}.chips input{width:auto}
.fo{display:flex;gap:8px;position:sticky;bottom:0;background:var(--card);padding-top:10px}
.ok-box{background:var(--soft);border:1px solid var(--ok);border-radius:10px;padding:14px;margin-bottom:14px}
.pin{font:700 28px Georgia,serif;letter-spacing:.2em}
.kan{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(220px,1fr);gap:12px;overflow-x:auto;padding-bottom:8px}
.col{background:var(--soft);border-radius:12px;padding:10px;min-height:200px}.col h3{font-size:14px;display:flex;justify-content:space-between;margin-bottom:8px}
.k{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin-bottom:8px}.k b{display:block}.k .lbl{color:var(--mut);font-size:13px}
.k .a{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.rl{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.rl .btn{display:flex;gap:6px;align-items:center}
.mx td,.mx th{text-align:center}.mx td:first-child,.mx th:first-child{text-align:left}.mx input{width:auto;accent-color:var(--acc)}
.toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;z-index:30}
.lbl{color:var(--mut);font-size:13px}
.sts{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;margin-bottom:12px}.sts div{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;color:var(--mut);font-size:13px}.sts b{display:block;font:700 22px Georgia,serif;color:var(--ink)}
.bar2{height:6px;background:var(--soft);border-radius:3px;overflow:hidden;margin-top:4px}.bar2 i{display:block;height:100%;background:var(--ok)}.bar2.warn i{background:var(--warn)}.bar2.bad i{background:var(--bad)}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:14px}.tc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:8px}.tc.off{opacity:.65}.th{display:flex;gap:10px;align-items:center}.av.lg{width:46px;height:46px;font-size:16px;margin:0}.tr{display:flex;justify-content:space-between;gap:8px;align-items:center}.tf{display:flex;justify-content:flex-end;gap:6px;margin-top:4px;border-top:1px solid var(--line);padding-top:10px}.er2{color:var(--bad);font-size:13px}
.mb{display:flex;gap:10px;align-items:flex-end;height:160px;margin-top:12px}.mb div{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;height:100%;font-size:12px;color:var(--mut)}.mb i{display:block;width:100%;max-width:56px;background:var(--acc);border-radius:6px 6px 0 0}.mb span{margin-top:4px;color:var(--ink);font-weight:700}
@media(max-width:820px){.app{display:block}aside.sb{position:static;height:auto;padding:10px}.sb h2,.sb small{display:none}#nav{display:flex;overflow-x:auto;gap:4px}.tb{white-space:nowrap;width:auto}.tb .n{display:none}.g2{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
<aside class="sb"><h2>People</h2><small>Dadka dugsiga</small><nav id="nav" aria-label="People"></nav></aside>
<main id="main"></main>
</div>
<div id="layer"></div>
<script>
const LK='people-admin-v1',PER=8;
const TABS=[['students','🎒','Ardayda'],['teachers','👩‍🏫','Macallimiinta'],['parents','👨‍👩‍👧','Waalidka & Xiriirada'],['adm','📝','Admissions Pipeline'],['fees','💰','Lacagta Dugsiga'],['roles','🔐','Staff Roles & Permissions']];
const MODS=[['students','Ardayda'],['teachers','Macallimiinta'],['parents','Waalidka'],['adm','Admissions'],['att','Imaanshaha'],['marks','Natiijooyinka'],['fees','Lacagaha'],['rep','Warbixinno'],['set','Settings']];
const ACT=[['v','Eeg'],['c','Abuur'],['e','Beddel'],['d','Tirtir'],['x','Dhoofi']];
const STAGES=[['applied','Codsi cusub'],['review','Hubin'],['interview','Wareysi / Imtixaan'],['accepted','La aqbalay'],['enrolled','La diiwaangeliyey'],['rejected','La diiday']];
const SUBJ=['Xisaab','Soomaali','Ingiriisi','Sayniis','Diin','Carabi','Juqraafi','Taariikh'];
const pm=s=>Object.fromEntries(MODS.map(([k])=>[k,s[k]||'']));
const seed=()=>({
 classes:[{id:'c1',n:'8A'},{id:'c2',n:'5B'},{id:'c3',n:'2A'},{id:'c4',n:'7C'}],
 parents:[{id:'p1',n:'Axmed Cabdi',ph:'0610000000',rel:'Aabo'},{id:'p2',n:'Xaawo Maxamed',ph:'0615111111',rel:'Hooyo'},{id:'p3',n:'Cali Warsame',ph:'0617222222',rel:'Aabo'}],
 students:[{id:'ST-0421',n:'Faadumo Axmed',g:'Gabadh',dob:'2013-04-02',cls:'c1',pid:'p1',st:'active'},{id:'ST-0388',n:'Cabdi Axmed',g:'Wiil',dob:'2016-09-12',cls:'c2',pid:'p1',st:'active'},{id:'ST-0510',n:'Hodan Axmed',g:'Gabadh',dob:'2019-01-20',cls:'c3',pid:'p1',st:'active'},{id:'ST-0433',n:'Maxamed Cali',g:'Wiil',dob:'2013-06-30',cls:'c1',pid:'p3',st:'active'},{id:'ST-0402',n:'Sagal Xaawo',g:'Gabadh',dob:'2014-11-05',cls:'c4',pid:'p2',st:'inactive'}],
 teachers:[{id:'t1',n:'Axmed Cali',ph:'0612345601',em:'axmed@school.so',sub:['Xisaab','Sayniis'],form:'c1',load:24,st:'active'},{id:'t2',n:'Hodan Nuur',ph:'0612345602',em:'',sub:['Soomaali'],form:'c2',load:18,st:'active'},{id:'t3',n:'Cumar Maxamed',ph:'0612345603',em:'',sub:['Ingiriisi'],form:'c3',load:22,st:'active'},{id:'t4',n:'Sacdiyo Yuusuf',ph:'0612345604',em:'',sub:['Sayniis','Juqraafi'],form:'',load:31,st:'active'}],
 apps:[{id:'a1',n:'Ayaan Jaamac',cls:'c1',gn:'Jaamac Nuur',ph:'0618000001',stage:'applied',note:''},{id:'a2',n:'Ismaaciil Cali',cls:'c2',gn:'Cali Ismaaciil',ph:'0618000002',stage:'review',note:''},{id:'a3',n:'Nasra Axmed',cls:'c3',gn:'Axmed Nasra',ph:'0618000003',stage:'interview',note:'Imtixaan Isniinta'},{id:'a4',n:'Bashiir Cumar',cls:'c4',gn:'Cumar Bashiir',ph:'0618000004',stage:'accepted',note:''}],
 roles:[{id:'r1',n:'Admin',lock:1,perm:pm(Object.fromEntries(MODS.map(([k])=>[k,'vcedx'])))},{id:'r2',n:'Registrar',perm:pm({students:'vced',teachers:'v',parents:'vced',adm:'vcedx',att:'v'})},{id:'r3',n:'Accountant',perm:pm({fees:'vcedx',students:'v',rep:'vx'})},{id:'r4',n:'Teacher',perm:pm({students:'v',att:'vce',marks:'vce'})},{id:'r5',n:'Librarian',perm:pm({students:'v'})}],
 staff:[{id:'u1',n:'Maryan Cabdi',ph:'0619000001',em:'maryan@school.so',role:'r1',st:'active'},{id:'u2',n:'Faarax Daahir',ph:'0619000002',em:'',role:'r2',st:'active'},{id:'u3',n:'Khadra Siciid',ph:'0619000003',em:'',role:'r3',st:'active'}]
});
let DB;try{DB=Object.assign(seed(),JSON.parse(localStorage.getItem(LK)||'{}'))}catch(e){DB=seed()}
const save=()=>{try{localStorage.setItem(LK,JSON.stringify(DB))}catch(e){}};
DB.students.forEach((s,i)=>{if(s.fee===undefined){s.fee=300;s.paid=[300,150,0,300,100][i%5];s.bus=i%2?'Haa':'Maya';s.adm='2024-09-01'}});
DB.teachers.forEach((t,i)=>{if(!t.hire){t.hire=['2019-09-01','2021-01-15','2022-09-01','2023-02-10'][i%4];t.q=t.q||['BSc Xisaab','Diploma Af-Soomaali','BA Ingiriisi','BSc Sayniis'][i%4]}});
let S={tab:'students',q:'',f:{},pg:1,dr:null,role:'r2',toast:'',tv:'cards'};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const $=id=>document.getElementById(id),uid=p=>p+Math.random().toString(36).slice(2,7);
const cn=id=>(DB.classes.find(c=>c.id===id)||{}).n||'—',pn=id=>(DB.parents.find(p=>p.id===id)||{}).n||'—',rn=id=>(DB.roles.find(r=>r.id===id)||{}).n||'—';
const ini=n=>n.split(' ').map(x=>x[0]).slice(0,2).join('');
const phone=v=>v.replace(/\D/g,'');
const tempPin=()=>{let p;do{p=String(100000+Math.floor(Math.random()*900000))}while(/^(\d)\1+$/.test(p)||'1234567890123456'.includes(p)||'6543210987654321'.includes(p));return p};
const nextSid=()=>'ST-'+String(Math.max(0,...DB.students.map(s=>+s.id.slice(3)))+1).padStart(4,'0');
const pill=(t,k='')=>`<span class="pill ${k}">${esc(t)}</span>`;
const stp=s=>s==='active'?pill('Active','ok'):pill('Inactive','bad');
// ---------- FORM CONFIG ----------
const clsOpts=()=>DB.classes.map(c=>[c.id,c.n]);
const FORMS={
 students:{t:'Arday cusub',te:'Beddel ardayga',sub:'ID iyo PIN ku-meel-gaar ah ayaa si toos ah u abuurmaya. Lacagta waxaa maamula Cashier-ka, bus-kana qaybta Transport.',f:[['n','Magaca buuxa','text',1],['g','Jinsiga','select',1,[['Wiil','Wiil'],['Gabadh','Gabadh']]],['dob','Taariikhda dhalashada','date',1],['cls','Fasalka','select',1,clsOpts],['_s','Waalidka / Mas’uulka'],['gn','Magaca waalidka','text',1],['gph','Telefoonka waalidka','tel',1],['rel','Xiriirka','select',0,[['Aabo','Aabo'],['Hooyo','Hooyo'],['Mas’uul','Mas’uul']]],['addr','Cinwaanka','text',0]]},
 teachers:{t:'Macallin cusub',te:'Beddel macallinka',sub:'Maaddooyinka iyo fasalka waxaa qoondeeya Teacher Assignment.',f:[['n','Magaca buuxa','text',1],['ph','Telefoonka','tel',1],['em','Email','email',0],['sub','Maaddooyinka uu dhigi karo','multi',0,()=>SUBJ.map(x=>[x,x])],['q','Waxbarasho / shahaado','text',0],['hire','Taariikhda shaqada bilowday','date',0]]},
 parents:{t:'Waalid / xiriir cusub',te:'Beddel waalidka',sub:'Lambarka telefoonku waa gaar (hal waalid, hal lambar).',f:[['n','Magaca buuxa','text',1],['ph','Telefoonka','tel',1],['rel','Xiriirka','select',1,[['Aabo','Aabo'],['Hooyo','Hooyo'],['Mas’uul','Mas’uul'],['Xiriir degdeg','Xiriir degdeg ah']]],['kids','Caruurta lagu xirayo','multi',0,()=>DB.students.map(s=>[s.id,s.n+' ('+cn(s.cls)+')'])]]},
 adm:{t:'Codsi cusub',te:'Beddel codsiga',sub:'Codsigu wuxuu ka bilaabmayaa "Codsi cusub".',f:[['n','Magaca codsadaha','text',1],['cls','Fasalka la codsanayo','select',1,clsOpts],['gn','Magaca waalidka','text',1],['ph','Telefoonka waalidka','tel',1],['note','Qoraal','textarea',0]]},
 staff:{t:'Shaqaale cusub',te:'Beddel shaqaalaha',sub:'Door doorka; fasaxyada ayaa ka imanaya doorkaas.',f:[['n','Magaca buuxa','text',1],['ph','Telefoonka','tel',1],['em','Email','email',0],['role','Doorka (Role)','select',1,()=>DB.roles.map(r=>[r.id,r.n])]]},
 pay:{t:'Diiwaangeli lacag',te:'Diiwaangeli lacag',sub:'Lacagta ardaygu bixiyey. Waxaa lagu daraa wadarta la bixiyey.',f:[['amt','Lacagta (USD)','number',1],['note','Qoraal (ikhtiyaari)','text',0]]},
 role:{t:'Role cusub',te:'Role',sub:'Fasaxyada ka dib ku dooro shabakadda.',f:[['n','Magaca role-ka','text',1],['from','Ka koobi fasaxyada','select',0,()=>[['','Madhan'],...DB.roles.map(r=>[r.id,r.n])]]]}
};
const KEYS={students:'students',teachers:'teachers',parents:'parents',adm:'apps',staff:'staff'};
function fld(f,v,er){const [k,l,t,req,o]=f;if(t===undefined)return `<div class="sec">${esc(l)}</div>`;
 const opts=typeof o==='function'?o():o;let inp='';
 if(t==='select')inp=`<select name="${k}">${opts.map(([a,b])=>`<option value="${esc(a)}" ${String(v??'')===String(a)?'selected':''}>${esc(b)}</option>`).join('')}</select>`;
 else if(t==='multi')inp=`<div class="chips">${opts.map(([a,b])=>`<label><input type="checkbox" name="${k}" value="${esc(a)}" ${(v||[]).includes(a)?'checked':''}>${esc(b)}</label>`).join('')||'<span class="lbl">Ma jiraan doorashooyin.</span>'}</div>`;
 else if(t==='textarea')inp=`<textarea name="${k}" rows="3">${esc(v)}</textarea>`;
 else inp=`<input name="${k}" type="${t}" value="${esc(v)}" ${t==='tel'?'inputmode="tel"':''}>`;
 return `<div class="f ${er?'bad':''}"><label>${esc(l)}${req?' <span class="req">*</span>':''}</label>${inp}${er?`<div class="er">${er}</div>`:''}</div>`}
function openForm(kind,id,errs={},vals){const F=FORMS[kind],arr=DB[KEYS[kind]]||[],rec=id?arr.find(r=>r.id===id):null;
 const v=vals||(rec?(kind==='students'?{...rec,gn:pn(rec.pid),gph:(DB.parents.find(p=>p.id===rec.pid)||{}).ph,rel:(DB.parents.find(p=>p.id===rec.pid)||{}).rel}:kind==='parents'?{...rec,kids:DB.students.filter(s=>s.pid===rec.id).map(s=>s.id)}:rec):{});
 S.dr={kind,id,errs,vals:v,done:null};drawer()}
function drawer(){const d=S.dr;if(!d){$('layer').innerHTML='';return}
 const F=FORMS[d.kind];
 if(d.done){$('layer').innerHTML=`<div class="ov" data-close="1"><aside class="dr" role="dialog" aria-modal="true"><h2>✓ Waa la kaydiyey</h2><div class="ok-box">${d.done}</div><button class="btn" data-close="1">Xidh</button></aside></div>`;return}
 $('layer').innerHTML=`<div class="ov" data-ovl="1"><aside class="dr" role="dialog" aria-modal="true" aria-label="${esc(F.t)}"><h2>${esc(d.id?F.te:F.t)}</h2><p class="sub">${esc(F.sub)}</p><form id="frm" novalidate>${F.f.map(f=>fld(f,d.vals[f[0]],d.errs[f[0]])).join('')}<div class="fo"><button class="btn" type="submit">Kaydi</button><button class="btn sec" type="button" data-close="1">Jooji</button></div></form></aside></div>`;
 const f=$('frm');if(f&&f.elements[0])f.elements[0].focus()}
function readForm(kind){const F=FORMS[kind],fm=$('frm'),v={};F.f.forEach(([k,,t])=>{if(!t)return;if(t==='multi')v[k]=[...fm.querySelectorAll(`[name="${k}"]:checked`)].map(x=>x.value);else v[k]=(fm.elements[k].value||'').trim()});return v}
function submitForm(){const d=S.dr,kind=d.kind,v=readForm(kind),er={};
 FORMS[kind].f.forEach(([k,l,t,req])=>{if(req&&t&&t!=='multi'&&!v[k])er[k]='Qasab.'});
 ['ph','gph'].forEach(k=>{if(v[k]&&phone(v[k]).length<9)er[k]='Lambar sax ah geli (9+ tiro).'});
 if(v.em&&!/^\S+@\S+\.\S+$/.test(v.em))er.em='Email khaldan.';
 const dupe=(arr,key)=>arr.find(x=>phone(x.ph)===phone(v[key])&&x.id!==d.id);
 if(kind==='parents'&&!er.ph&&dupe(DB.parents,'ph'))er.ph='Lambarkan waalid kale ayaa leh.';
 if(kind==='teachers'&&!er.ph&&dupe(DB.teachers,'ph'))er.ph='Lambarkan macallin kale ayaa leh.';
 if(kind==='staff'&&!er.ph&&dupe(DB.staff,'ph'))er.ph='Lambarkan shaqaale kale ayaa leh.';
 if(kind==='students'&&v.dob&&v.dob>new Date().toISOString().slice(0,10))er.dob='Taariikhdu ma noqon karto mustaqbal.';
 
 if(kind==='pay'){const st=DB.students.find(x=>x.id===d.id),left=st.fee-st.paid;if(!(+v.amt>0))er.amt='Geli lacag sax ah.';else if(+v.amt>left)er.amt='Waxa harsan waa $'+left+' oo keliya.'}
 if(Object.keys(er).length){S.dr.errs=er;S.dr.vals=v;drawer();const b=document.querySelector('.f.bad input,.f.bad select');if(b)b.focus();return}
 let msg='';

  if(k==='teachers'){const tt=DB.teachers.find(x=>x.id===id);if(tt.load>0&&!confirm('Macallinkan wuxuu leeyahay qoondeyn ('+tt.load+' periods). Waa la tirtiraa?'))return}
  if(k==='staff'&&DB.staff.find(x=>x.id===id).role==='r1'&&DB.staff.filter(x=>x.role==='r1').length<2)return alert('Admin ugu dambeeya lama tirtiri karo.');
  DB[KEYS[k]]=DB[KEYS[k]].filter(x=>x.id!==id);save();render();toast('Waa la tirtiray');return}
 if(d.pay){const s=DB.students.find(x=>x.id===d.pay),left=(s.fee||0)-(s.paid||0);if(left<=0){toast('Lacagta oo dhan waa la bixiyey');return}S.dr={kind:'pay',id:d.pay,errs:{},vals:{amt:left},done:null};drawer();return}
 if(d.pin){const s=DB.students.find(x=>x.id===d.pin);if(!confirm('PIN cusub u samee '+s.n+'?'))return;S.dr={kind:'students',done:`<b>${esc(s.n)}</b> · ${s.id}<p class="lbl" style="margin:8px 0 2px">PIN cusub (mar keliya ayaa la tusayaa)</p><div class="pin">${tempPin()}</div><p class="lbl">Ardaygu wuxuu qasab u beddelayaa galitaanka xiga.</p>`};drawer();return}
 if(d.mv){const[id,dx]=d.mv.split('|'),a=DB.apps.find(x=>x.id===id),o=STAGES.map(s=>s[0]).filter(k=>k!=='rejected'),i=o.indexOf(a.stage)+Number(dx);if(a.stage==='rejected')a.stage='review';else if(o[i]&&o[i]!=='enrolled')a.stage=o[i];save();render();return}
 if(d.rej){DB.apps.find(x=>x.id===d.rej).stage='rejected';save();render();return}
 if(d.enr){const a=DB.apps.find(x=>x.id===d.enr);let p=DB.parents.find(x=>phone(x.ph)===phone(a.ph));if(!p){p={id:uid('p'),n:a.gn,ph:a.ph,rel:'Mas’uul'};DB.parents.push(p)}
  const id=nextSid(),pin=tempPin();DB.students.push({id,n:a.n,g:'',dob:'',cls:a.cls,pid:p.id,st:'active'});a.stage='enrolled';save();render();
  S.dr={kind:'students',done:`<b>${esc(a.n)}</b> waa la diiwaangeliyey, Fasalka ${esc(cn(a.cls))}<p class="lbl" style="margin:8px 0 2px">Student ID</p><div class="pin" style="font-size:22px">${id}</div><p class="lbl" style="margin:8px 0 2px">PIN ku-meel-gaar ah</p><div class="pin">${pin}</div><p class="lbl">Waxaa lagu daray liiska Ardayda. Buuxi jinsiga iyo taariikhda dhalashada.</p>`};drawer();return}
 if(d.tv){S.tv=d.tv;render();return}
 if(d.role){S.role=d.role;render();return}
 if(d.delrole){if(!confirm('Tirtir role-kan?'))return;DB.roles=DB.roles.filter(r=>r.id!==d.delrole);S.role=DB.roles[0].id;save();render();return}});
document.addEventListener('submit',e=>{if(e.target.id==='frm'){e.preventDefault();submitForm()}});
document.addEventListener('input',e=>{if(e.target.id==='q'){S.q=e.target.value;S.pg=1;render()}});
document.addEventListener('change',e=>{const t=e.target;
 if(t.dataset.f!==undefined){S.f[t.dataset.f]=t.value;S.pg=1;render()}
 else if(t.dataset.pm){const[r,m,c]=t.dataset.pm.split('|'),R=DB.roles.find(x=>x.id===r);let p=R.perm[m];p=t.checked?(p.includes(c)?p:p+c):p.replace(c,'');if(c==='v'&&!t.checked)p='';if(c!=='v'&&t.checked&&!p.includes('v'))p+='v';R.perm[m]=p;save();render()}
 else if(t.dataset.sr){const s=DB.staff.find(x=>x.id===t.dataset.sr);if(s.role==='r1'&&DB.staff.filter(x=>x.role==='r1').length<2){alert('Admin ugu dambeeya ma beddeli karo.');render();return}s.role=t.value;save();render();toast('Role waa la beddelay')}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&S.dr){S.dr=null;drawer()}});
render();
</script>
</body>
</html>
