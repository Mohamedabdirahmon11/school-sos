name: Supabase Database Backup

on:
  schedule:
    - cron: '0 2 * * *'
  workflow_dispatch:
    inputs:
      force:
        description: Run a backup even when the platform preference is manual or not due today
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: schoolos-supabase-backup
  cancel-in-progress: false

jobs:
  backup:
    name: Create off-site database backup
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_ACCESS_KEY }}
      AWS_REGION: ${{ secrets.BACKUP_S3_REGION }}
      BACKUP_S3_BUCKET: ${{ secrets.BACKUP_S3_BUCKET }}
      BACKUP_S3_PREFIX: ${{ vars.BACKUP_S3_PREFIX || 'schoolos' }}
    steps:
      - name: Check required private backup destination
        shell: bash
        run: |
          for name in SUPABASE_DB_URL AWS_ACCESS_KEY_ID AWS_SECRET_ACCESS_KEY AWS_REGION BACKUP_S3_BUCKET; do
            if [[ -z "${!name:-}" ]]; then
              echo "::error::Missing required GitHub Actions secret/variable: $name. Configure a private S3 bucket and the documented secrets before enabling automated backups."
              exit 1
            fi
          done

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client

      - name: Check configured backup frequency
        id: policy
        shell: bash
        env:
          FORCE_BACKUP: ${{ inputs.force || 'false' }}
        run: |
          frequency="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -Atqc "select coalesce((select backup_schedule from public.super_admin_settings where id = 'default'), 'manual')")"
          weekday="$(date -u +%u)"
          run_backup=false
          case "$frequency" in
            daily) run_backup=true ;;
            weekly) [[ "$weekday" == "1" ]] && run_backup=true ;;
            manual) run_backup=false ;;
            *)
              echo "::error::Unsupported backup_schedule value: $frequency"
              exit 1
              ;;
          esac
          if [[ "$FORCE_BACKUP" == "true" ]]; then run_backup=true; fi
          echo "frequency=$frequency" >> "$GITHUB_OUTPUT"
          echo "run_backup=$run_backup" >> "$GITHUB_OUTPUT"
          echo "Backup policy: $frequency; run: $run_backup (UTC)."

      - name: Dump database roles, schema, and data
        if: steps.policy.outputs.run_backup == 'true'
        shell: bash
        run: |
          mkdir -p backup
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/roles.sql --role-only
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/schema.sql
          supabase db dump --db-url "$SUPABASE_DB_URL" -f backup/data.sql --data-only --use-copy -x "storage.buckets_vectors" -x "storage.vector_indexes"
          printf 'created_at_utc=%s\nfrequency=%s\n' "$(date -u +%FT%TZ)" "${{ steps.policy.outputs.frequency }}" > backup/manifest.txt
          sha256sum backup/roles.sql backup/schema.sql backup/data.sql > backup/SHA256SUMS
          tar -czf schoolos-supabase-backup.tar.gz -C backup .

      - name: Upload encrypted backup to private S3 bucket
        id: upload
        if: steps.policy.outputs.run_backup == 'true'
        shell: bash
        run: |
          object_key="${BACKUP_S3_PREFIX%/}/schoolos-db-backup-$(date -u +%Y%m%dT%H%M%SZ)-${GITHUB_RUN_ID}.tar.gz"
          aws s3 cp schoolos-supabase-backup.tar.gz "s3://${BACKUP_S3_BUCKET}/${object_key}" --sse AES256 --no-progress
          echo "object_key=${object_key}" >> "$GITHUB_OUTPUT"
          echo "Backup uploaded to private S3 key: ${object_key}"

      - name: Record successful off-site backup in platform settings and audit
        if: steps.policy.outputs.run_backup == 'true'
        shell: bash
        env:
          BACKUP_OBJECT_KEY: ${{ steps.upload.outputs.object_key }}
        run: |
          psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 \
            -v run_id="$GITHUB_RUN_ID" \
            -v run_attempt="$GITHUB_RUN_ATTEMPT" \
            -v object_key="$BACKUP_OBJECT_KEY" <<'SQL'
          UPDATE public.super_admin_settings
          SET last_backup_date = NOW(), last_backup_status = 'success'
          WHERE id = 'default';

          INSERT INTO public.audit_logs
            (id, timestamp, action, category, user_id, user_name, user_role, details, severity)
          VALUES (
            'github-actions-backup-' || :'run_id' || '-' || :'run_attempt',
            NOW(),
            'PLATFORM_OFFSITE_BACKUP_COMPLETED',
            'security',
            'system',
            'GitHub Actions',
            'super_admin',
            'Encrypted database backup uploaded to private S3 object: ' || :'object_key',
            'info'
          )
          ON CONFLICT (id) DO UPDATE
            SET timestamp = EXCLUDED.timestamp,
                details = EXCLUDED.details,
                severity = EXCLUDED.severity;
          SQL
