            artifacts/parent-portal/
            artifacts/playwright-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Link side-by-side screenshots in the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = '${{ steps.parent-portal-artifact.outputs.artifact-url }}';
