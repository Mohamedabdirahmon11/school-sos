name: SchoolOS CI

on:
  push:
    branches:
      - main
      - fix/schoolos-audit-2026-11-03
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schoolos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript checks
        run: npm run lint

      - name: Test suite
        run: npm run test:ci

      - name: Route parity audit
        run: npm run audit:routes

      - name: Row-level security source audit
        run: npm run audit:rls

      - name: Production build
        run: npm run build
