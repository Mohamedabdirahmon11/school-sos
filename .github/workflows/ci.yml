name: SchoolOS CI

on:
  push:
    branches:
      - main
      - fix/schoolos-audit-2026-11-03
      - phase-3-quality
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schoolos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript checks
        run: npm run typecheck:ci

      - name: Test suite
        run: npm test

      - name: Route parity audit
        run: npm run audit:routes

      - name: Navigation registry audit
        run: npm run audit:navigation

      - name: Row-level security source audit
        run: npm run audit:rls

      - name: Production build
        run: npm run build

  teacher-portal-visual:
    name: Teacher Portal responsive screenshots
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture Teacher Portal screenshots
        run: npx playwright test --config tests/visual/playwright.config.ts --grep 'Teacher Portal'

      - name: Upload responsive screenshot matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-portal-visual-${{ github.sha }}
          path: |
            artifacts/teacher-portal/
            artifacts/playwright-results/
          if-no-files-found: warn
          retention-days: 14

  school-setup-visual:
    name: School Setup Wizard responsive screenshots
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture ten-step Setup Wizard matrix
        run: npx playwright test --config tests/visual/playwright.config.ts --grep 'School Setup Wizard'

      - name: Upload Setup Wizard screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-setup-visual-${{ github.sha }}
          path: |
            artifacts/school-setup/
            artifacts/playwright-results/
          if-no-files-found: warn
          retention-days: 14
