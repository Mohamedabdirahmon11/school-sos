name: SchoolOS CI

on:
  push:
    branches:
      - main
      - fix/schoolos-audit-2026-11-03
      - phase-3-quality
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: schoolos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript checks
        run: npm run typecheck:ci

      - name: Test suite
        run: npm test

      - name: Route parity audit
        run: npm run audit:routes

      - name: Navigation registry audit
        run: npm run audit:navigation

      - name: Row-level security source audit
        run: npm run audit:rls

      - name: Production build
        run: npm run build


  school-setup-sql:
    name: School Setup PostgreSQL migration integration
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: schoolos_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d schoolos_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run SQL migration integration checks
        env:
          PGPASSWORD: postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          psql "postgresql://postgres:postgres@localhost:5432/schoolos_test" -v ON_ERROR_STOP=1 -f tests/sql/school-setup-migrations.test.sql

  teacher-portal-visual:
    name: Teacher Portal responsive screenshots
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture Teacher Portal screenshots
        run: npx playwright test --config tests/visual/playwright.config.ts --grep 'Teacher Portal'

      - name: Upload responsive screenshot matrix
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: teacher-portal-visual-${{ github.sha }}
          path: |
            artifacts/teacher-portal/
            artifacts/playwright-results/
          if-no-files-found: warn
          retention-days: 14

  student-portal-visual:
    name: Student Portal responsive reference screenshots
    runs-on: ubuntu-latest
    needs: validate
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install project dependencies
        run: npm ci

      - name: Install Playwright test runner
        run: npm install --no-save --no-package-lock @playwright/test

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Capture Student Portal reference comparison matrix
        run: npx playwright test --config tests/visual/playwright.config.ts --grep 'Student Portal'

      - name: Upload Student Portal screenshots and comparisons
        id: student-portal-artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: student-portal-visual-${{ github.sha }}
          path: |
            artifacts/student-portal/
            artifacts/playwright-results/
          if-no-files-found: warn
          retention-days: 14

      - name: Link side-by-side screenshots in the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const artifactUrl = '${{ steps.student-portal-artifact.outputs.artifact-url }}';
            if (!artifactUrl) return;
            const marker = '<!-- student-portal-visual-comparison -->';
            const body = marker + '\n### Student Portal visual comparison\nThe artifact contains reference and SchoolOS screenshots side by side for 8 sections × 4 viewport widths × 2 themes.\n\n[Open screenshot comparison artifact](' + artifactUrl + ')';
            const { data: comments } = await github.rest.issues.listComments({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

