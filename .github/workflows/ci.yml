name: SchoolOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: schoolos-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Typecheck, tests, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: TypeScript checks
        run: npm run typecheck:ci

      - name: Test suite
        run: npm run test:ci

      - name: Schema conformance test
        run: npx tsx --test tests/schema-conformance.test.ts

      - name: Route parity audit
        run: npm run audit:routes

      - name: RLS source audit
        run: npm run audit:rls

      - name: Production build
        run: npm run build
